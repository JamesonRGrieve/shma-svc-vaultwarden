---
- name: Validate service contract
  include_role:
    name: common.validate_schema

- name: Determine target runtimes
  vars:
    candidate_runtimes: "{{ runtime | default(target_runtimes | default(runtime_templates.keys() | list)) }}"
  set_fact:
    service_target_runtimes: "{{ candidate_runtimes if (candidate_runtimes is iterable and candidate_runtimes is not string) else [candidate_runtimes] }}"

- name: Set infrastructure template root
  set_fact:
    infrastructure_template_root: "{{ [role_path | dirname, 'infrastructure', 'templates'] | path_join }}"

- name: Normalize service packages and services for targeted runtimes
  set_fact:
    service_packages: "{{ vaultwarden_service_packages if 'baremetal' in service_target_runtimes else [] }}"
    service_services: "{{ vaultwarden_service_services if 'baremetal' in service_target_runtimes else [] }}"

- name: Calculate deployment metadata
  set_fact:
    vaultwarden_effective_replicas: "{{ (service_replicas | default(1)) | int }}"

- name: Calculate expected WebSocket allocations
  set_fact:
    vaultwarden_expected_websocket_allocations: "{{ vaultwarden_websocket_enabled | ternary(1, 0) }}"

- name: Build inventory service port registry
  set_fact:
    vaultwarden_inventory_published_ports: "{{ hostvars | dict2items | map(attribute='value') | selectattr('service_ports', 'defined') | map(attribute='service_ports') | list | sum(start=[]) }}"

- name: Detect WebSocket port reuse across services
  set_fact:
    vaultwarden_websocket_port_conflicts: "{{ vaultwarden_inventory_published_ports | selectattr('published', 'equalto', vaultwarden_websocket_port) | list }}"

- name: Guard against WebSocket port conflicts
  assert:
    that:
      - (vaultwarden_websocket_port_conflicts | length) <= vaultwarden_expected_websocket_allocations
    fail_msg: "WebSocket port {{ vaultwarden_websocket_port }} is already allocated by another service. Choose a unique port for Vaultwarden notifications."
  when: vaultwarden_websocket_enabled

- name: Determine if admin token hardening applies
  set_fact:
    vaultwarden_require_admin_token: "{{ (production | default(false)) or (service_target_runtimes | difference(['dev']) | length > 0) }}"

- name: Enforce non-default admin token in hardened modes
  assert:
    that:
      - vaultwarden_admin_token != 'change-me-vaultwarden-admin'
    fail_msg: "ADMIN_TOKEN must be rotated from the default when deploying outside of dev or when production=true."
  when: vaultwarden_require_admin_token

- name: Require Argon2id-hashed admin token
  assert:
    that:
      - vaultwarden_admin_token is match('^\\$argon2id\\$')
    fail_msg: "ADMIN_TOKEN must be an Argon2id hash generated via `vaultwarden hash`. Plaintext passwords are rejected."
  when: vaultwarden_admin_token != 'change-me-vaultwarden-admin'

- name: Disallow cleartext PostgreSQL URLs
  assert:
    that:
      - (vaultwarden_database_url_secret | length) > 0
    fail_msg: "PostgreSQL DATABASE_URL must be sourced from an encrypted secret (SOPS/age). Set vaultwarden_database_url_secret."
  when: vaultwarden_database_backend == 'postgres' and (vaultwarden_database_url is match('^postgres(ql)?://'))

- name: Prevent scaling beyond one replica on SQLite
  assert:
    that:
      - vaultwarden_effective_replicas == 1
    fail_msg: "SQLite backend only supports a single replica. Configure PostgreSQL and shared storage before scaling."
  when: vaultwarden_database_backend == 'sqlite'

- name: Require PostgreSQL when scaling beyond a single replica
  assert:
    that:
      - vaultwarden_database_backend == 'postgres'
    fail_msg: "Scaling Vaultwarden past one replica requires a PostgreSQL backend and shared storage (RWX)."
  when: vaultwarden_effective_replicas > 1

- name: Warn when WebSockets are disabled
  debug:
    msg: "Vaultwarden WebSockets are disabled. Real-time sync for desktop, browser, and mobile clients will fall back to polling."
    warn: true
  when: not vaultwarden_websocket_enabled

- name: Build runtime template map
  set_fact:
    service_runtime_templates: "{{ service_runtime_templates | default({}) | combine({ item.key: ([infrastructure_template_root, item.value] | path_join) }) }}"
  loop: "{{ runtime_templates | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure requested runtimes are supported
  assert:
    that:
      - runtime_item in service_runtime_templates
    fail_msg: "Runtime {{ runtime_item }} not supported by service {{ service_id }}"
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item

- name: Render and apply runtime(s)
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item
    label: "{{ runtime_item }}"
  block:
    - name: Render runtime {{ runtime_item }}
      include_role:
        name: common.render_runtime
      vars:
        runtime_templates: "{{ service_runtime_templates }}"
        runtime: "{{ runtime_item }}"

    - name: Apply runtime {{ runtime_item }}
      include_role:
        name: common.apply_runtime
      vars:
        runtime: "{{ runtime_item }}"